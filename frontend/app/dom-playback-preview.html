<!doctype html><html><head><title>ktv420 DOM transport test</title></head><body style="background:#17110e;color:#eee;font:14px system-ui">
<h1>DOM transport test</h1><p>Synthetic local audio only. No Spotify account or cloud processing.</p>
<div data-testid="now-playing-bar"><div data-testid="now-playing-widget"><a data-testid="context-item-info-title"></a><span data-testid="context-item-info-subtitles">Test artist</span></div>
<button data-testid="control-button-skip-back">Previous</button><button data-testid="control-button-playpause" aria-label="Play">Play</button><button data-testid="control-button-skip-forward">Next</button>
