<!doctype html><html><head><meta charset="utf-8"><title>ktv420 visualizer preview</title></head><body>
<main style="max-width:1100px;margin:24px auto;padding:0 24px"><div style="display:flex;align-items:center;gap:20px;margin-bottom:16px"><h1 style="margin:0;color:var(--ww-title-pink)">ktv420</h1><button id="start">Preview synthetic mix</button><button id="mute">Mute drums</button><span style="color:var(--ww-text-soft)">Silent monitoring</span></div>
<section class="stem-weather"><canvas id="weather" style="height:240px" aria-label="Stem Weather preview"></canvas><div class="stem-weather__legend"><span>Drums · rain</span><span>Bass · waves</span><span>Vocals · thread</span><span>Other · atmosphere</span></div></section>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px"><section><h3>Spectrogram</h3><canvas id="spectrogram" style="width:100%;height:170px" aria-label="Spectrogram preview"></canvas></section><section><h3>Stereo Bloom</h3><canvas id="bloom" style="width:100%;height:170px" aria-label="Stereo Bloom preview"></canvas></section></div><p id="result" role="status"></p></main><script type="module" src="/visual-preview.ts"></script></body></html>
