<!doctype html><html><head><meta charset="utf-8"><title>Kaleidoscope music preview</title></head><body>
<main style="max-width:1100px;margin:24px auto;padding:24px"><h1>Kaleidoscope</h1>
<p>Music-driven motion · synthetic beat · silent monitoring</p>
<button id="pause">Pause</button><button id="mute">Mute</button><button id="expand">Large panel</button>
<label>Energy <input id="energy" type="range" min="0" max="1" step=".01" value=".55"></label>
<canvas id="scene" aria-label="Kaleidoscope preview" style="width:100%;height:340px;margin-top:24px"></canvas><p id="status"></p><p id="timing"></p>
</main><script type="module" src="/kaleidoscope-preview.ts"></script></body></html>
