name: Build and publish ktv420
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ktv420-publish
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json
      - run: npm ci
        working-directory: frontend/app
      - run: npm test && npm run lint && npm run build
        working-directory: frontend/app
      - run: node scripts/build-extension.mjs
      - run: node scripts/retain-player-assets.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ktv420-extension
          path: |
            dist/ktv420-extension.zip
            dist/ktv420-extension.zip.sha256
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.SA_KEY }}'
      - run: npx --yes firebase-tools@14.27.0 deploy --only hosting --project ktv420 --non-interactive
